; Configuração do PHP no contentor (por cima do php.ini-production da imagem oficial).

; dompdf (faturas demo) precisa de mais do que os 128M por omissão.
memory_limit = 256M

; Imagens até 5 MB (logótipo e portefólio); com os 2M por omissão uploads válidos eram rejeitados.
upload_max_filesize = 6M
post_max_size = 8M

expose_php = Off

; O código não muda dentro do contentor: sem verificar a data dos ficheiros em cada pedido.
opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
