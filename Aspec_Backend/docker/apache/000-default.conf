# Porta injetada pelo Render na variável PORT (10000 por omissão, ver Dockerfile).
Listen ${PORT}

ServerName localhost
ServerTokens Prod
ServerSignature Off

# 512 MB de memória no Render Free: poucos processos do Apache, para sobrar memória para o worker da fila.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    ServerLimit 6
    MaxRequestWorkers 6
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    # AllowOverride All: as regras de reescrita do Laravel estão em public/.htaccess.
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Sem query string nem Referer: os links assinados (ativação, reativação) trazem a assinatura no URL.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" aspec
    CustomLog ${APACHE_LOG_DIR}/access.log aspec
</VirtualHost>
